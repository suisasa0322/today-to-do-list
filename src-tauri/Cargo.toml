[package]
name = "today-to-do-list"
version = "0.1.0"
description = "A desktop todo list"
authors = ["suisasa"]
edition = "2021"

[lib]
name = "today_to_do_list_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
